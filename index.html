}
const hday=d=>gem(parseInt(hn.format(d)));
const at=(y,m,d)=>new Date(y,m,d,12);
const key=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

const fmtD=k=>{const d=kd(k),p=hp(d);return 'יום '+WD[d.getDay()]+', '+d.getDate()+' ב'+d.toLocaleDateString('he-IL',{month:'long'})+' '+d.getFullYear()+' · '+hday(d)+' ב'+p.month+' '+p.year};
const desc=r=>T[r.type]+(r.time?' ('+(r.type==='late'?'מגיע ב־':'יוצא ב־')+r.time+')':'');
let dbErr="",FB=0,seeded=0,db=null,users=[],reqs=[],msgs=[],locks=[],covers=[],me=null,view='',tab='cal',armed='';

const todayK=key(tm.getFullYear(),tm.getMonth(),tm.getDate());

function absOf(r,u){

    if(r.type==='vac')o.push([a,b]);

function missingOf(r){const u=users.find(x=>x.id===r.uid);return u?rng(absOf(r,u)):''}
function analyze(d){
  const day=users.map(u=>({u:u,sh:shOf(u,d.date)})).filter(x=>x.sh.length);
  const me2=users.find(x=>x.id===d.uid),missing=me2?absOf(d,me2):[],viol=[];
  if(!day.length)return{missing:missing,viol:viol};
  const ab={};
  reqs.filter(x=>x.date===d.date&&x.id!==d.rid).concat([d]).forEach(r=>{const u=users.find(x=>x.id===r.uid);if(u)(ab[u.id]=ab[u.id]||[]).push(...absOf(r,u))});
  const pts=new Set([1080]);
  day.forEach(x=>x.sh.forEach(([a,b])=>{pts.add(a);pts.add(b)}));
  Object.values(ab).forEach(l=>l.forEach(([a,b])=>{pts.add(a);pts.add(b)}));
  covers.filter(c=>c.date===d.date).forEach(c=>{pts.add(tm2(c.from));pts.add(tm2(c.to))});
  const P=[...pts].sort((a,b)=>a-b),all=[].concat(...day.map(x=>x.sh)),lo=Math.min(...all.map(x=>x[0])),hi=Math.max(...all.map(x=>x[1]));
  for(let i=0;i<P.length-1;i++){
    const a=P[i],b=P[i+1];if(a<lo||b>hi)continue;

    const have=day.filter(x=>x.sh.some(([s1,e1])=>s1<=a&&e1>=b)&&!(ab[x.u.id]||[]).some(([s1,e1])=>s1<=a&&e1>=b)).length+covers.filter(c=>c.date===d.date&&tm2(c.from)<=a&&tm2(c.to)>=b).length;
    if(have<need){const l=viol[viol.length-1];if(l&&l[1]===a&&l[2]===have&&l[3]===need)l[1]=b;else viol.push([a,b,have,need])}
  }

const violText=an=>an.viol.map(([a,b,h,n])=>m2t(a)+'–'+m2t(b)+' ('+h+' עובדים במקום '+n+')').join(', ');

}

const hEn=new Intl.DateTimeFormat('en-u-ca-hebrew',{month:'long',day:'numeric'});
function hPart(dt){const o={};hEn.formatToParts(dt).forEach(p=>o[p.type]=p.value);return{m:o.month,d:parseInt(o.day)}}
function hStart(dt){const d=new Date(dt);while(hPart(d).d!==1)d.setDate(d.getDate()-1);return d}
function hLen(st){let n=0;const d=new Date(st);do{d.setDate(d.getDate()+1);n++}while(hPart(d).d!==1);return n}
function holiday(dt){
  const q=hPart(dt),m=q.m,d=q.d,wd=dt.getDay(),L=[],add=(n,t)=>L.push({n:n,t:t});
  if(d===30){const nx=new Date(dt);nx.setDate(nx.getDate()+1);if(hPart(nx).m!=='Tishri')add('ראש חודש '+hp(nx).month,'rc')}
  if(d===1&&m!=='Tishri')add('ראש חודש '+hp(dt).month,'rc');
  if(m==='Tishri'){
    if(d===1||d===2)add('ראש השנה','yt');
    if((d===3&&wd!==6)||(d===4&&wd===0))add('צום גדליה','fast');
    if(d===9)add('ערב יום כיפור','eve');
    if(d===10)add('יום כיפור','yt');
    if(d===14)add('ערב סוכות','eve');
    if(d===15)add('סוכות','yt');
    if(d>=16&&d<=20)add('חול המועד סוכות','cm');
    if(d===21)add('הושענא רבה','cm');
    if(d===22)add('שמיני עצרת · שמחת תורה','yt');
  }else if(m==='Kislev'){
    if(d>=25)add('חנוכה · יום '+(d-24),'mod');
  }else if(m==='Tevet'){
    if(d<=3){const pv=new Date(dt);pv.setDate(pv.getDate()-d);const n=hPart(pv).d-24+d;if(n<=8)add('חנוכה · יום '+n,'mod')}
    if(d===10)add('צום עשרה בטבת','fast');
  }else if(m==='Shevat'){
    if(d===15)add('ט״ו בשבט','mod');
  }else if(m==='Adar I'){
    if(d===14)add('פורים קטן','mod');
    if(d===15)add('שושן פורים קטן','mod');
  }else if(m==='Adar'||m==='Adar II'){
    if((d===13&&wd!==6)||(d===11&&wd===4))add('תענית אסתר','fast');
    if(d===14)add('פורים','mod');
    if(d===15)add('שושן פורים','mod');
  }else if(m==='Nisan'){
    if(d===14)add('ערב פסח','eve');
    if(d===15)add('פסח','yt');
    if(d>=16&&d<=20)add('חול המועד פסח','cm');
    if(d===21)add('שביעי של פסח','yt');
    if((d===27&&wd!==5&&wd!==0)||(d===26&&wd===4)||(d===28&&wd===1))add('יום הזיכרון לשואה ולגבורה','mod');
  }else if(m==='Iyar'){
    const w5=((wd+5-d)%7+7)%7,ind=w5===5?4:w5===6?3:w5===1?6:5;
    if(d===ind-1)add('יום הזיכרון לחללי צה״ל','mod');
    if(d===ind)add('יום העצמאות','mod');
    if(d===18)add('ל״ג בעומר','mod');
    if(d===28)add('יום ירושלים','mod');
  }else if(m==='Sivan'){
    if(d===5)add('ערב שבועות','eve');
    if(d===6)add('שבועות','yt');
  }else if(m==='Tamuz'){
    if((d===17&&wd!==6)||(d===18&&wd===0))add('צום י״ז בתמוז','fast');
  }else if(m==='Av'){
    if((d===9&&wd!==6)||(d===10&&wd===0))add('תשעה באב','fast');
    if(d===15)add('ט״ו באב','mod');
  }else if(m==='Elul'){
    if(d===29)add('ערב ראש השנה','eve');
  }
  return L;
}

      app_url: currentAppUrl // שולח את הקישור הנוכחי הדינמי
    },{publicKey:'p8OrBzEgsDRGI7wL6'});
    
    if(!isRem)toast('נשלח מייל למנהל · סוג: '+typeDesc+' · הערה: '+noteText);
  }catch(x){if(!isRem)mailFallback(d)}
}
async function delReq(){
  try{await db.collection('requests').doc(medit).delete();closeM()}catch(x){$('#me').textContent='אירעה שגיאה במחיקה'}
}
function inboxView(){
  const mine=msgs.filter(m=>m.to===me.id).sort((a,b)=>b.ts-a.ts);
  let h='<div class="glass"><div class="row" style="justify-content:space-between;align-items:center;margin:0 0 10px"><b>תיבת הודעות</b>'+(mine.length?'<button onclick="delAllMsgs()">מחיקת כל ההודעות</button>':'')+'</div>';
  if(!mine.length)h+='<div class="mu">אין הודעות</div>';
  mine.forEach(m=>{
    let tail='';
    if(m.rid){
      const r=reqs.find(x=>x.id===m.rid);
      if(!r)tail='<div class="mu" style="margin-top:6px">הבקשה כבר אינה קיימת (נדחתה או בוטלה)</div>';
      else if(r.status==='pending'&&me.role==='manager')tail='<div class="row"><button class="pri" onclick="decide(\''+m.rid+'\',true)">אישור</button><button onclick="decide(\''+m.rid+'\',false)" style="color:var(--no)">דחייה</button></div>';
      else if(r.status==='approved')tail='<div class="ok" style="margin-top:6px">הבקשה אושרה</div>';
    }
    h+='<div class="msg'+(m.read?'':' un')+'"><div>'+(m.reminder?'<b style="color:var(--late)">⏰ תזכורת · </b>':'')+esc(m.text)+'</div>'+(m.alert?'<div class="alt">⚠ '+esc(m.alert)+'</div>':'')+'<small>'+new Date(m.ts).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})+'</small>'+tail+(m.rid&&me.role==='manager'&&reqs.some(x=>x.id===m.rid&&x.status==='pending')?'':'<div class="row"><button style="color:var(--no)" onclick="delMsg(\''+m.id+'\')">מחיקת הודעה</button></div>')+'</div>';
  });
  return h+'</div>';
}
async function decide(rid,ok){
  const r=reqs.find(x=>x.id===rid);if(!r)return;
  try{
    if(ok)await db.collection('requests').doc(rid).update({status:'approved'});
    else await db.collection('requests').doc(rid).delete();
    await db.collection('messages').add({to:r.uid,text:'הבקשה שלך ('+desc(r)+' · '+fmtD(r.date)+') '+(ok?'אושרה ✓':'לא אושרה והוסרה מלוח השנה'),ts:Date.now(),read:false});
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
async function quickDel(id){try{await db.collection('requests').doc(id).delete();closeM();toast('הבקשה נמחקה')}catch(x){toast('אירעה שגיאה במחיקה')}}
async function delMsg(id){try{await db.collection('messages').doc(id).delete()}catch(x){toast('אירעה שגיאה במחיקה')}}
async function delAllMsgs(){try{for(const m of msgs.filter(m=>m.to===me.id&&!(m.rid&&me.role==='manager'&&reqs.some(x=>x.id===m.rid&&x.status==='pending'))))await db.collection('messages').doc(m.id).delete();toast('ההודעות נמחקו')}catch(x){toast('אירעה שגיאה במחיקה')}}
function lockList(){return locks.slice().sort((a,b)=>a.id<b.id?-1:1).map(l=>'<div class="ur"><span>🔒 '+fmtD(l.id)+'</span><button onclick="unlock(\''+l.id+'\')">שחרור</button></div>').join('')||'<div class="mu">אין ימים נעולים</div>'}
async function unlock(k){try{await db.collection('locks').doc(k).delete()}catch(x){toast('אירעה שגיאה')}}
async function lockRange(on){
  const a=$('#lf').value,b=$('#lt').value||a,e=$('#le2');
  if(!a){e.textContent='יש לבחור תאריך';return}
  if(b<a){e.textContent='תאריך הסיום מוקדם מההתחלה';return}
  let d=kd(a);const end=kd(b),ks=[];
  while(d<=end&&ks.length<92){ks.push(key(d.getFullYear(),d.getMonth(),d.getDate()));d=at(d.getFullYear(),d.getMonth(),d.getDate()+1)}
  try{for(const k of ks){if(on)await db.collection('locks').doc(k).set({date:k,ts:Date.now()});else if(isLocked(k))await db.collection('locks').doc(k).delete()}e.textContent='';toast(on?'הימים ננעלו':'הנעילה שוחררה')}catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
function staffView(){
  const adm=me.role==='admin';
  let h='<div class="glass" id="sf"><b>נעילת ימים</b><div class="sub">בחרו תאריך או טווח תאריכים. בימים נעולים לא ניתן להגיש בקשות חדשות (עד 3 חודשים בכל פעולה)</div><div class="row"><div style="flex:1;min-width:130px"><label>מתאריך</label><input id="lf" type="date"></div><div style="flex:1;min-width:130px"><label>עד תאריך</label><input id="lt" type="date"></div></div><div class="err" id="le2"></div><div class="row" style="margin-bottom:8px"><button class="pri" onclick="lockRange(true)">🔒 נעילה</button><button onclick="lockRange(false)">🔓 שחרור</button></div>'+lockList()+'<div style="height:22px"></div>';
  if(adm){
    h+='<b>הוספת עובד</b><div style="height:8px"></div><label>שם משתמש</label><input id="sn"><label>סיסמה</label><input id="sp"><div class="err" id="se"></div><button class="pri" onclick="addU()">הוספת עובד</button><div style="height:22px"></div><b>משתמשים</b><div class="sub">המנהל המאשר מקבל ומאשר את כל בקשות העובדים</div>';
    const ord={admin:0,manager:1,employee:2};
    users.slice().sort((a,b)=>ord[a.role]-ord[b.role]||a.name.localeCompare(b.name,'he')).forEach(u=>{
      h+='<div class="ur"><span><b>'+esc(u.name)+'</b> <span class="mu">· '+RL[u.role]+' · סיסמה: '+esc(u.pass)+'</span></span><span class="row" style="margin:0"><button onclick="editU(\''+u.id+'\')">עריכה</button>'+(u.role==='employee'?'<button onclick="setMgr(\''+u.id+'\')">הגדר כמנהל מאשר</button><button onclick="delU(\''+u.id+'\')" style="color:var(--no)">'+(armed===u.id?'לחצו שוב למחיקה':'מחיקה')+'</button>':'')+'</span></div>';
    });
  }
  return h+'</div>';
}
function editU(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  $('#modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="md"><h3>עריכת משתמש</h3><div class="sub">'+RL[u.role]+'</div><label>שם משתמש</label><input id="en" value="'+esc(u.name)+'"><label>סיסמה</label><input id="ep" value="'+esc(u.pass)+'"><label>שעות עבודה (ראשון–חמישי)</label><input id="es" dir="ltr" placeholder="10:00-14:00, 18:00-22:00" value="'+esc((u.shifts||[]).join(', '))+'"><div class="err" id="ee2"></div><div class="row"><button class="pri" onclick="saveU(\''+id+'\')">שמירה</button><button onclick="closeM()">ביטול</button></div></div></div>';
}
async function saveU(id){
  const n=$('#en').value.trim(),p=$('#ep').value.trim(),e=$('#ee2');
  if(!n||!p){e.textContent='יש למלא שם וסיסמה';return}
  if(users.some(u=>u.name===n&&u.id!==id)){e.textContent='שם המשתמש כבר קיים';return}
  try{
    await db.collection('users').doc(id).update({name:n,pass:p,shifts:parseSh($('#es').value)});
    for(const r of reqs.filter(x=>x.uid===id&&x.name!==n))await db.collection('requests').doc(r.id).update({name:n});
    closeM();toast('הפרטים נשמרו');
  }catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
async function setMgr(id){
  try{
    for(const u of users.filter(x=>x.role==='manager'&&x.id!==id))await db.collection('users').doc(u.id).update({role:'employee'});
    await db.collection('users').doc(id).update({role:'manager'});
    for(const r of reqs.filter(x=>x.status==='pending'&&x.uid!==id))await db.collection('messages').add({to:id,rid:r.id,text:r.name+' הגיש/ה בקשה: '+desc(r)+' · '+fmtD(r.date),ts:Date.now(),read:false});
    toast('המנהל המאשר עודכן');
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
async function saveMail(){
  const v=$('#em').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$('#ee').textContent='כתובת מייל לא תקינה';return}
  try{await db.collection('users').doc(me.id).update({email:v});$('#ee').textContent='';toast('המייל נשמר')}catch(x){$('#ee').textContent='אירעה שגיאה, נסו שוב'}
}
async function addU(){
  const n=$('#sn').value.trim(),p=$('#sp').value.trim(),e=$('#se');
  if(!n||!p){e.textContent='יש למלא שם משתמש וסיסמה';return}
  if(users.some(u=>u.name===n)){e.textContent='שם המשתמש כבר קיים';return}
  try{await db.collection('users').add({name:n,pass:p,role:'employee'});$('#sn').value='';$('#sp').value='';e.textContent='';toast('העובד נוסף')}catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
async function delU(id){
  if(armed!==id){armed=id;render();return}
  armed='';
  try{
    for(const r of reqs.filter(x=>x.uid===id))await db.collection('requests').doc(r.id).delete();
    await db.collection('users').doc(id).delete();
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
setInterval(checkReminders,60000);setTimeout(checkReminders,4000);
init();
</script>
