<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול חופשות עובדים</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("wCeBE6ElGGjo1CMIX");
       })();
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-top: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h2>ניהול חופשות עובדים</h2>
        <div id="login-screen" class="login-box">
            <div class="form-group" style="width: 100%;">
                <label>שם משתמש</label>
                <input type="text" id="username" placeholder="הכנס שם משתמש">
            </div>
            <div class="form-group" style="width: 100%;">
                <label>סיסמה</label>
                <input type="password" id="password" placeholder="הכנס סיסמה">
            </div>
            <button onclick="handleLogin()">התחבר</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA5-ySbUKH4Z09zMsc3MCgrbc...",
            authDomain: "employee-vacations-3a755.firebaseapp.com",
            projectId: "employee-vacations-3a755",
            storageBucket: "employee-vacations-3a755.appspot.com",
            messagingSenderId: "1079736132859",
            appId: "1:1079736132859:web:1f5abc635c59..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "אהרן משה" && pass === "0852") {
                alert("התחברת בהצלחה!");
                loadDashboard(user);
            } else if (user && pass) {
                alert("התחברת בהצלחה!");
                loadDashboard(user);
            } else {
                alert("נא להזין שם משתמש וסיסמה");
            }
        }

        function loadDashboard(userName) {
            document.getElementById('app').innerHTML = `
                <h2>שלום, ${userName}</h2>
                <div class="form-group">
                    <label>תאריך חופשה / בקשה</label>
                    <input type="date" id="vacation-date">
                </div>
                <div class="form-group">
                    <label>סיבה / הערות</label>
                    <textarea id="vacation-reason" placeholder="כתוב את סיבת הבקשה..."></textarea>
                </div>
                <button onclick="submitVacation('${userName}')">שלח בקשה למנהל</button>
            `;
        }

        function submitVacation(userName) {
            const date = document.getElementById('vacation-date').value;
            const reason = document.getElementById('vacation-reason').value;

            if (!date) {
                alert("נא לבחור תאריך");
                return;
            }

            // שמירה ב־Firebase
            db.collection("vacations").add({
                employeeName: userName,
                date: date,
                reason: reason,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // שליחה אוטומטית ברקע דרך EmailJS
                emailjs.send("service_x9y47lp", "template_mk2vhtr", {
                    to_name: "אהרן משה",
                    from_name: userName,
                    dates: date,
                    reason: reason,
                    message: `הוגשה בקשת חופשה חדשה על ידי ${userName} בתאריך: ${date}`
                }).then(() => {
                    alert("הבקשה נשמרה ונשלח מייל אוטומטי למנהל בהצלחה!");
                }).catch((error) => {
                    console.error("EmailJS Error:", error);
                    alert("הבקשה נשמרה במסד הנתונים בהצלחה (שליחת המייל האוטומטי דרשה גיבוי).");
                });
            }).catch((error) => {
                alert("שגיאה בשמירת הבקשה: " + error.message);
            });
        }
    </script>
</body>
</html>
